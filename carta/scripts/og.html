<!doctype html>
<!-- Fuente de og.jpg (1200×630), la vista previa de WhatsApp. Se regenera con un navegador
     headless a 1200×630 y se guarda como og.jpg en la raíz. -->
<html lang="es-CO">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background-color: #E9DFCE;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,96,64,.07) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,96,64,.07) 0 1px, transparent 1px 3px),
      radial-gradient(90% 90% at 50% 30%, #F4ECDF 0%, transparent 75%);
  }
  .sobre { position: relative; width: 600px; height: 400px; filter: drop-shadow(0 30px 34px rgba(58,42,31,.3)); transform: rotate(-2deg); }
  .sobre > div { position: absolute; }
  .fondo { inset: 0; border-radius: 10px; background: #EFE3CC; }
  .solapa { left: 0; right: 0; top: 0; height: 60%; border-radius: 10px 10px 0 0;
    background: linear-gradient(#E7D7BB, #EFE3CC); clip-path: polygon(0 0, 100% 0, 50% 100%);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.12)); }
  .pliegue { inset: 0; border-radius: 10px; background: linear-gradient(to top, rgba(0,0,0,.05), transparent 60%);
    clip-path: polygon(0 100%, 50% 55%, 100% 100%); }
  .lacre { left: 50%; top: 60%; width: 132px; height: 132px; transform: translate(-50%, -50%);
    display: grid; place-items: center;
    border-radius: 50% 47% 52% 49% / 49% 52% 47% 51%;
    background: radial-gradient(circle at 34% 30%, #A8383E 0%, #7E1A1F 42%, #4F0E12 100%);
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.28), 0 5px 10px rgba(0,0,0,.3);
    font: italic 500 64px/1 'Cormorant Garamond', serif; color: rgba(40,6,8,.55); }
  .lacre::before { content: ""; position: absolute; inset: 15%; border-radius: 50%; border: 1.5px solid rgba(255,220,210,.25); }
  .para { left: 0; right: 0; bottom: 34px; text-align: center; font: 400 44px/1 'Caveat', cursive; color: rgba(58,42,31,.72); }
</style>
</head>
<body>
  <div class="sobre">
    <div class="fondo"></div>
    <div class="pliegue"></div>
    <div class="solapa"></div>
    <div class="lacre">B</div>
    <div class="para">Para la Pistolera</div>
  </div>
</body>
</html>
