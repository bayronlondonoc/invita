<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Una semilla 🌱</title>
  <meta name="description" content="Te mandé una semilla. Riégala.">
  <meta property="og:title" content="Te mandé una semilla 🌱">
  <meta property="og:description" content="Riégala con cariño.">
  <meta property="og:image" content="https://bayronlondonoc.github.io/invita/og.png">
  <meta name="theme-color" content="#0E1A14">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="../assets/florece.css">
  <style>
    .noche { position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(90% 55% at 50% 100%, rgba(212,106,159,.18), transparent 70%), radial-gradient(120% 70% at 50% 0%, var(--noche-2), var(--noche) 70%); }
    .maceta { position: relative; width: min(100%, 300px); margin: 4px auto 0; touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; }
    .planta { width: 62%; margin: 0 auto; }
    .planta svg { display: block; width: 100%; overflow: visible; }
    .planta__todo { transform-box: view-box; transform-origin: 100px 230px; transform: scale(calc(.55 + var(--crece, 0) * .09)); transition: transform .8s var(--rebote); }
    .planta__boton { transform-box: view-box; transform-origin: 100px 98px; animation: latir 2.4s ease-in-out infinite; }
    .maceta__matera { z-index: 1; }
    .maceta__matera { width: 46%; height: 64px; margin: -4px auto 0; border-radius: 4px 4px 22px 22px;
      background: linear-gradient(#B4663F, #8E4A2B); box-shadow: inset 0 6px 0 rgba(255,255,255,.12), 0 10px 18px -10px rgba(0,0,0,.5); position: relative; }
    .maceta__matera::before { content: ""; position: absolute; left: -6%; right: -6%; top: -10px; height: 16px; border-radius: 4px; background: #C27448; }
    .gota { position: absolute; top: 0; width: 9px; height: 13px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 35% 35%, #E6F4FF, #7FB8E6 70%); animation: caer .9s ease-in forwards; z-index: 2; pointer-events: none; }
    @keyframes caer { from { transform: translateY(-20px); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(170px); opacity: 0; } }
    .contador { display: flex; justify-content: center; gap: 6px; margin: 10px 0 2px; font-size: 1.2rem; }
    .contador span { opacity: .22; transition: opacity .3s, transform .3s var(--rebote); }
    .contador span.lleno { opacity: 1; transform: scale(1.15); }
    .frase-riego { min-height: 2.8em; margin: 8px 0 0; font: italic 500 1.35rem/1.3 var(--f-serif); color: var(--vino); }
    .pista { font: italic 600 1.7rem/1.3 var(--f-serif); color: var(--vino); margin: 8px 0 4px; }
  </style>
</head>
<body>
  <div class="noche" aria-hidden="true"></div>
  <div id="bosque" class="bosque" aria-hidden="true"><div class="bosque__luciernagas"></div></div>
  <main class="escena" id="escena"></main>
<script>
(() => {
  'use strict';
  const PARA = 'Tulipán';
  const DE = 'Bayron';
  const RIEGOS = 5;
  const FRASES = ['Le gustó 💧', 'Está creciendo…', 'Mira cómo se estira 🌱', 'Ya casi… se está poniendo tímida'];
  const escena = document.getElementById('escena');
  const h = (tag, props = {}, ...hijos) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    }
    hijos.flat().forEach((c) => c != null && c !== false && n.append(c));
    return n;
  };

  // Luciérnagas de fondo
  const nube = document.querySelector('.bosque__luciernagas');
  for (let i = 0; i < 18; i++) {
    const l = h('span', { class: 'luciernaga' });
    l.style.left = `${Math.random() * 100}%`; l.style.top = `${10 + Math.random() * 85}%`;
    l.style.setProperty('--dx', `${(Math.random() - .5) * 120}px`); l.style.setProperty('--dy', `${-20 - Math.random() * 90}px`);
    l.style.setProperty('--dur', `${6 + Math.random() * 8}s`); l.style.setProperty('--retraso', `${-Math.random() * 8}s`);
    nube.append(l);
  }

  let actual = null;
  async function mostrar(nueva) {
    if (actual) { actual.classList.remove('visible'); await new Promise((r) => setTimeout(r, 420)); actual.remove(); }
    escena.append(nueva); actual = nueva;
    requestAnimationFrame(() => requestAnimationFrame(() => nueva.classList.add('visible')));
  }
  const hoja = (...hijos) => h('section', { class: 'pantalla' }, h('article', { class: 'hoja' }, ...hijos));

  function riego() {
    let n = 0;
    const flor = h('div', { class: 'planta', html: `
      <svg viewBox="0 0 200 230" aria-hidden="true">
        <defs>
          <radialGradient id="bt" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#FFF4F9"/><stop offset=".55" stop-color="#F2B9D6"/><stop offset="1" stop-color="#C9619B"/></radialGradient>
          <linearGradient id="hj" x1="0" x2="1"><stop offset="0" stop-color="#7FA36B"/><stop offset="1" stop-color="#3F6B4A"/></linearGradient>
        </defs>
        <g class="planta__todo">
          <path d="M100 230 C96 190 106 150 100 96" fill="none" stroke="#3F6B4A" stroke-width="5" stroke-linecap="round"/>
          <path class="planta__hoja" d="M99 196 C70 192 46 174 42 152 C68 152 92 168 99 196 Z" fill="url(#hj)"/>
          <path class="planta__hoja" d="M101 166 C128 160 150 140 152 118 C126 120 106 138 101 166 Z" fill="url(#hj)"/>
          <g class="planta__boton">
            <path d="M100 30 C78 48 76 80 100 98 C124 80 122 48 100 30 Z" fill="url(#bt)"/>
            <path d="M100 98 C88 92 84 84 86 76 C92 84 96 90 100 98 C104 90 108 84 114 76 C116 84 112 92 100 98 Z" fill="#5E8C55"/>
          </g>
        </g>
      </svg>` });
    const maceta = h('div', { class: 'maceta', role: 'button', tabindex: '0', 'aria-label': 'Regar la semilla' }, flor, h('div', { class: 'maceta__matera' }));
    const gotas = Array.from({ length: RIEGOS }, () => h('span', { text: '💧' }));
    const frase = h('p', { class: 'frase-riego', 'aria-live': 'polite' });
    const boton = h('button', { class: 'btn', type: 'button', text: 'Regar 💧' });
    const regar = () => {
      if (n >= RIEGOS) return;
      n += 1;
      gotas[n - 1].classList.add('lleno');
      for (let i = 0; i < 6; i++) {
        const g = h('span', { class: 'gota' });
        g.style.left = `${38 + Math.random() * 24}%`;
        g.style.animationDelay = `${i * 70}ms`;
        maceta.append(g);
        setTimeout(() => g.remove(), 1400);
      }
      flor.style.setProperty('--crece', n);
      if (navigator.vibrate && navigator.userActivation?.hasBeenActive) try { navigator.vibrate(20); } catch {}
      if (n < RIEGOS) { frase.textContent = FRASES[n - 1]; return; }
      boton.disabled = true;
      frase.textContent = 'Todavía no florece…';
      setTimeout(() => { frase.textContent = 'Florece mañana. 🌸'; }, 1400);
      setTimeout(pregunta, 3600);
    };
    maceta.addEventListener('click', regar);
    maceta.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); regar(); } });
    boton.addEventListener('click', regar);
    mostrar(hoja(
      h('p', { class: 'eyebrow', text: `Para ${PARA}` }),
      h('h1', { class: 'titulo', text: 'Te mandé una semilla' }),
      h('p', { class: 'texto texto--suave', text: 'Riégala con cariño. Tócala para darle agua.' }),
      maceta, h('div', { class: 'contador', 'aria-hidden': 'true' }, gotas), frase, boton));
  }

  function pregunta() {
    const si = h('button', { class: 'btn', type: 'button', text: 'Sí' });
    const no = h('button', { class: 'btn btn-claro btn-huye', type: 'button', text: 'No' });
    const arena = h('div', { class: 'arena-mini' }, si, no);
    const reaccion = h('p', { class: 'texto texto--suave reaccion', 'aria-live': 'polite' });
    const frases = ['Uy, casi 😏', 'Ese botón no quiere, jaja', 'El No se fue a dormir 😴'];
    let intentos = 0;
    let ultima = 0;
    const huir = (e) => {
      if (e) e.preventDefault();
      const t = performance.now();
      if (t - ultima < 450 || !no.isConnected) return;
      ultima = t;
      intentos += 1;
      reaccion.textContent = frases[Math.min(intentos, frases.length) - 1];
      if (intentos >= frases.length) { no.classList.add('se-va'); setTimeout(() => no.remove(), 400); return; }
      const W = arena.clientWidth - no.offsetWidth;
      const H = arena.clientHeight - no.offsetHeight;
      const r = { l: si.offsetLeft - 16, r: si.offsetLeft + si.offsetWidth + 16, t: si.offsetTop - 16, b: si.offsetTop + si.offsetHeight + 16 };
      for (let k = 0; k < 60; k++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        if (!(x < r.r && x + no.offsetWidth > r.l && y < r.b && y + no.offsetHeight > r.t) && Math.hypot(x - no.offsetLeft, y - no.offsetTop) > 70) {
          no.style.left = `${x}px`; no.style.top = `${y}px`; return;
        }
      }
    };
    no.addEventListener('touchstart', huir, { passive: false });
    no.addEventListener('pointerdown', huir);
    no.addEventListener('click', (e) => { e.preventDefault(); huir(); });
    no.addEventListener('focus', () => { huir(); si.focus(); });
    arena.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse' || !no.isConnected) return;
      const b = no.getBoundingClientRect();
      if (Math.hypot(e.clientX - (b.left + b.width / 2), e.clientY - (b.top + b.height / 2)) < 80) huir();
    });
    si.addEventListener('click', pista);
    mostrar(hoja(
      h('p', { class: 'eyebrow', text: 'Mientras tanto' }),
      h('h2', { class: 'titulo', text: '¿Quieres una pista?' }),
      arena, reaccion));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      si.style.left = `${arena.clientWidth * .18}px`; si.style.top = `${(arena.clientHeight - si.offsetHeight) / 2}px`;
      no.style.left = `${arena.clientWidth * .82 - no.offsetWidth}px`; no.style.top = `${(arena.clientHeight - no.offsetHeight) / 2}px`;
      arena.classList.add('lista');
    }));
  }

  function pista() {
    mostrar(hoja(
      h('p', { class: 'eyebrow', text: 'La pista' }),
      h('p', { class: 'pista', text: 'Mañana trae tu iPad cargado…' }),
      h('p', { class: 'pista', text: '…y tu voz. 🎤' }),
      h('p', { class: 'texto texto--suave', text: 'Tu semilla florece cuando nos veamos. 🌸' }),
      h('p', { class: 'firma', text: `— ${DE}` })));
  }

  riego();
})();
</script>
</body>
</html>
