<!doctype html>
<!-- Fuente de og.png (1200×630). Regenerar con:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og.png "file://$PWD/scripts/og.html" -->
<html lang="es-CO">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@400&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(90% 90% at 50% 20%, #F4ECE1 0%, #E7DACA 70%, #DCCBB6 100%);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }
  .escena { display: flex; flex-direction: column; align-items: center; gap: 34px; }
  .sobre { position: relative; width: 520px; height: 347px; filter: drop-shadow(0 30px 36px rgba(46,38,34,.3)); }
  .sobre > div { position: absolute; }
  .interior { inset: 0; border-radius: 10px; background: #D9B8B0; }
  .bolsillo { inset: 0; border-radius: 10px; background: #EADCC9; clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
  .bolsillo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.07), transparent 70%); clip-path: polygon(0 100%, 50% 56%, 100% 100%); }
  .solapa-wrap { left: 0; right: 0; top: 0; height: 60%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.14)); }
  .solapa { position: absolute; inset: 0; border-radius: 10px 10px 0 0; background: linear-gradient(#E2D0B9, #EADCC9); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .sello {
    left: 50%; top: 60%; width: 120px; height: 120px; transform: translate(-50%, -50%);
    border-radius: 50% 47% 52% 49% / 49% 52% 47% 51%;
    background: radial-gradient(circle at 34% 30%, #D9BD8E 0%, #B08D57 40%, #86683B 100%);
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.2), 0 5px 10px rgba(0,0,0,.25);
    display: grid; place-items: center;
  }
  .sello::before { content: ""; position: absolute; inset: 15%; border-radius: 50%; border: 1.5px solid rgba(255,240,215,.35); }
  .sello span { font: italic 600 64px/1 'Cormorant Garamond', serif; color: rgba(60,40,15,.62); text-shadow: 0 1px 0 rgba(255,235,200,.45); }
  .hint { font: 400 18px/1 'Jost', sans-serif; letter-spacing: .34em; text-transform: uppercase; color: rgba(46,38,34,.6); }
</style>
</head>
<body>
  <div class="escena">
    <div class="sobre">
      <div class="interior"></div>
      <div class="bolsillo"></div>
      <div class="solapa-wrap"><div class="solapa"></div></div>
      <div class="sello"><span>♥</span></div>
    </div>
    <div class="hint">Ábrela con calma</div>
  </div>
</body>
</html>
